! DC-CORE1 - Data centre core switch and OSPF area border router (sanitized lab template)
! DC-CORE2 mirrors this with .3 SVI addresses, HSRP priority 100 and router-id 1.1.1.2.
! Secrets are replaced with <REDACTED>. Validate in your own lab before use.
hostname DC-CORE1
!
no ip domain-lookup
ip domain-name lab.example
ip routing
!
! --- Management hardening (same pattern as HOSP-A-DIST1) ---
username admin privilege 15 secret <REDACTED>
aaa new-model
aaa authentication login default local
ip ssh version 2
! (exec mode, once: crypto key generate rsa modulus 2048)
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
!
line vty 0 15
 transport input ssh
 access-class MGMT-ONLY in
!
snmp-server group MON v3 priv
snmp-server user zabbix MON v3 auth sha <REDACTED> priv aes 128 <REDACTED>
logging host 10.10.100.30
logging trap informational
service timestamps log datetime msec localtime
!
interface Loopback0
 description Management and OSPF router ID
 ip address 10.10.99.11 255.255.255.255
!
! --- Data centre VLANs ---
vlan 99
 name DC-MGMT
vlan 100
 name SERVERS
!
spanning-tree mode rapid-pvst
spanning-tree vlan 99,100 priority 4096
!
interface Vlan99
 description DC management hosts
 ip address 10.10.99.130 255.255.255.128
 standby version 2
 standby 99 ip 10.10.99.129
 standby 99 priority 110
 standby 99 preempt
!
interface Vlan100
 description Servers: DC-WIN1, DC-EHR1, DC-MON1
 ip address 10.10.100.2 255.255.255.0
 standby version 2
 standby 100 ip 10.10.100.1
 standby 100 priority 110
 standby 100 preempt
!
interface range GigabitEthernet1/0/31-32
 description EtherChannel to DC-CORE2
 no switchport
 channel-group 2 mode active
!
interface Port-channel2
 description Core interlink to DC-CORE2 (area 0)
 no switchport
 ip address 172.16.0.9 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
! --- Routed links ---
interface GigabitEthernet1/0/20
 description To DC-EDGE-RTR (area 0)
 no switchport
 ip address 172.16.0.1 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
interface GigabitEthernet1/0/21
 description To pfSense LAN (static, VPN backup path)
 no switchport
 ip address 172.16.0.5 255.255.255.252
!
interface GigabitEthernet1/0/1
 description To HOSP-A-DIST1 (area 1)
 no switchport
 ip address 172.16.1.1 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
interface GigabitEthernet1/0/2
 description To HOSP-B-DIST1 (area 2)
 no switchport
 ip address 172.16.2.1 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
interface GigabitEthernet1/0/11
 description To CLINIC1-RTR primary WAN (area 3)
 no switchport
 ip address 172.16.101.1 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
! Clinics 2 to 5 follow the same pattern on Gi1/0/12-15 with 172.16.(100+N).1/30.
!
! --- OSPF: area 0 here, ABR for areas 1, 2 and 3 ---
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Port-channel2
 no passive-interface GigabitEthernet1/0/20
 no passive-interface GigabitEthernet1/0/1
 no passive-interface GigabitEthernet1/0/2
 no passive-interface GigabitEthernet1/0/11
 area 0 authentication message-digest
 area 1 authentication message-digest
 area 2 authentication message-digest
 area 3 authentication message-digest
 ! Clinics: totally stubby. They only need a default route from the core.
 area 3 stub no-summary
 ! Summarize each area toward the backbone.
 area 1 range 10.20.0.0 255.255.0.0
 area 2 range 10.30.0.0 255.255.0.0
 area 3 range 10.100.0.0 255.255.248.0
 network 10.10.99.11 0.0.0.0 area 0
 network 10.10.99.128 0.0.0.127 area 0
 network 10.10.100.0 0.0.0.255 area 0
 network 172.16.0.0 0.0.0.3 area 0
 network 172.16.0.8 0.0.0.3 area 0
 network 172.16.1.0 0.0.0.3 area 1
 network 172.16.2.0 0.0.0.3 area 2
 network 172.16.101.0 0.0.0.3 area 3
!
! --- Clinic backup path ---
! If a clinic's primary link fails, its /24 disappears from OSPF and this floating
! static (AD 250) sends the traffic to pfSense, which carries it over IPsec.
! Use /24s, not the /21 summary: the summary's Null0 discard route (AD 110) would win.
ip route 10.100.1.0 255.255.255.0 172.16.0.6 250 name CLINIC1-VPN-BACKUP
ip route 10.100.2.0 255.255.255.0 172.16.0.6 250 name CLINIC2-VPN-BACKUP
ip route 10.100.3.0 255.255.255.0 172.16.0.6 250 name CLINIC3-VPN-BACKUP
ip route 10.100.4.0 255.255.255.0 172.16.0.6 250 name CLINIC4-VPN-BACKUP
ip route 10.100.5.0 255.255.255.0 172.16.0.6 250 name CLINIC5-VPN-BACKUP
!
end
