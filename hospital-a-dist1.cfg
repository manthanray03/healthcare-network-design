! HOSP-A-DIST1 - Hospital A distribution switch (sanitized lab template)
! DIST2 mirrors this with .3 SVI addresses and HSRP priority 100.
hostname HOSP-A-DIST1
!
no ip domain-lookup
ip domain-name lab.example
ip routing
!
! --- Management hardening ---
username admin privilege 15 secret <REDACTED>
aaa new-model
aaa authentication login default local
ip ssh version 2
! (exec mode, once: crypto key generate rsa modulus 2048)
!
ip access-list standard MGMT-ONLY
 permit 10.20.99.0 0.0.0.255
 permit 10.10.99.0 0.0.0.255
!
line vty 0 15
 transport input ssh
 access-class MGMT-ONLY in
!
snmp-server group MON v3 priv
snmp-server user zabbix MON v3 auth sha <REDACTED> priv aes 128 <REDACTED>
logging host 10.10.100.30
logging trap informational
!
! --- Layer 2 ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,99 priority 4096
!
vlan 10
 name CLINICAL
vlan 20
 name ADMIN
vlan 30
 name VOIP
vlan 40
 name GUEST
vlan 50
 name MEDDEV
vlan 99
 name MGMT
!
interface range GigabitEthernet1/0/1-2
 description EtherChannel to HOSP-A-DIST2
 channel-group 1 mode active
!
interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
!
interface range GigabitEthernet1/0/3-12
 description Access ports - clinical
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- ACLs ---
ip access-list extended CLINICAL-IN
 permit udp any eq bootpc any eq bootps
 permit udp 10.20.10.0 0.0.0.255 host 10.10.100.10 eq domain
 permit tcp 10.20.10.0 0.0.0.255 host 10.10.100.10 eq domain
 permit tcp 10.20.10.0 0.0.0.255 host 10.10.100.20 eq 443
 permit icmp 10.20.10.0 0.0.0.255 any
 ! Add AD ports (88, 389, 445, 135) if clinical PCs are domain-joined
 deny   ip any any log
ip access-list extended GUEST-IN
 permit udp any eq bootpc any eq bootps
 deny   ip any 10.0.0.0 0.255.255.255
 deny   ip any 172.16.0.0 0.15.255.255
 deny   ip any 192.168.0.0 0.0.255.255
 permit ip any any
 ! Guest DHCP scope hands out public DNS servers, not internal ones
ip access-list extended MEDDEV-IN
 permit udp any eq bootpc any eq bootps
 permit tcp 10.20.50.0 0.0.0.255 host 10.10.100.20 eq 443
 deny   ip any any log
!
! --- SVIs with HSRP (DIST1 is active) ---
interface Vlan10
 description CLINICAL gateway
 ip address 10.20.10.2 255.255.255.0
 ip helper-address 10.10.100.10
 ip access-group CLINICAL-IN in
 standby version 2
 standby 10 ip 10.20.10.1
 standby 10 priority 110
 standby 10 preempt
!
interface Vlan20
 description ADMIN gateway
 ip address 10.20.20.2 255.255.255.0
 ip helper-address 10.10.100.10
 standby version 2
 standby 20 ip 10.20.20.1
 standby 20 priority 110
 standby 20 preempt
!
interface Vlan30
 description VOIP gateway
 ip address 10.20.30.2 255.255.255.0
 ip helper-address 10.10.100.10
 standby version 2
 standby 30 ip 10.20.30.1
 standby 30 priority 110
 standby 30 preempt
!
interface Vlan40
 description GUEST gateway
 ip address 10.20.40.2 255.255.255.0
 ip helper-address 10.10.100.10
 ip access-group GUEST-IN in
 standby version 2
 standby 40 ip 10.20.40.1
 standby 40 priority 110
 standby 40 preempt
!
interface Vlan50
 description MEDDEV gateway
 ip address 10.20.50.2 255.255.255.0
 ip helper-address 10.10.100.10
 ip access-group MEDDEV-IN in
 standby version 2
 standby 50 ip 10.20.50.1
 standby 50 priority 110
 standby 50 preempt
!
interface Vlan99
 description MGMT
 ip address 10.20.99.2 255.255.255.0
 standby version 2
 standby 99 ip 10.20.99.1
 standby 99 priority 110
 standby 99 preempt
!
! --- Uplink and routing ---
interface GigabitEthernet1/0/24
 description Uplink to DC-CORE1
 no switchport
 ip address 172.16.1.2 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
router ospf 1
 router-id 1.1.1.11
 passive-interface default
 no passive-interface GigabitEthernet1/0/24
 area 1 authentication message-digest
 network 10.20.0.0 0.0.255.255 area 1
 network 172.16.1.0 0.0.0.3 area 1
!
end
