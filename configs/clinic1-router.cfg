! CLINIC1-RTR - Standard clinic template (sanitized lab template)
! Clinic N: replace 10.100.1.x with 10.100.N.x, 172.16.101.x with 172.16.(100+N).x,
! 172.31.1.x with 172.31.N.x, and use that clinic's backup internet address.
! Secrets are replaced with <REDACTED>. Validate in your own lab before use.
hostname CLINIC1-RTR
!
no ip domain-lookup
ip domain-name lab.example
!
username admin privilege 15 secret <REDACTED>
aaa new-model
aaa authentication login default local
ip ssh version 2
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
 permit 10.100.1.224 0.0.0.15
!
line vty 0 4
 transport input ssh
 access-class MGMT-ONLY in
!
snmp-server group MON v3 priv
snmp-server user zabbix MON v3 auth sha <REDACTED> priv aes 128 <REDACTED>
logging host 10.10.100.30
logging trap informational
service timestamps log datetime msec localtime
!
! --- Guest DHCP is local and hands out public DNS, never internal servers ---
ip dhcp excluded-address 10.100.1.129 10.100.1.135
ip dhcp pool GUEST
 network 10.100.1.128 255.255.255.224
 default-router 10.100.1.129
 dns-server 9.9.9.9 149.112.112.112
!
! --- QoS: voice first on the WAN links ---
! Phones mark RTP as DSCP EF (46) and signalling as CS3; routed ports keep the marking.
class-map match-any VOICE
 match dscp ef
class-map match-any VOICE-SIGNALLING
 match dscp cs3
!
policy-map WAN-EDGE
 class VOICE
  priority percent 30
 class VOICE-SIGNALLING
  bandwidth percent 5
 class class-default
  fair-queue
!
! --- ACLs (same intent as the hospital template) ---
ip access-list extended CLINICAL-IN
 permit udp any eq bootpc any eq bootps
 permit udp 10.100.1.0 0.0.0.63 host 10.10.100.10 eq domain
 permit tcp 10.100.1.0 0.0.0.63 host 10.10.100.10 eq domain
 permit tcp 10.100.1.0 0.0.0.63 host 10.10.100.20 eq 443
 permit icmp 10.100.1.0 0.0.0.63 any
 deny   ip any any log
ip access-list extended GUEST-IN
 permit udp any eq bootpc any eq bootps
 deny   ip any 10.0.0.0 0.255.255.255
 deny   ip any 172.16.0.0 0.15.255.255
 deny   ip any 192.168.0.0 0.0.255.255
 permit ip any any
!
! --- LAN: one trunk to the clinic switch, one subinterface per VLAN ---
interface GigabitEthernet0/1
 description Trunk to clinic switch
 no ip address
!
interface GigabitEthernet0/1.10
 description CLINICAL
 encapsulation dot1Q 10
 ip address 10.100.1.1 255.255.255.192
 ip helper-address 10.10.100.10
 ip access-group CLINICAL-IN in
!
interface GigabitEthernet0/1.20
 description ADMIN
 encapsulation dot1Q 20
 ip address 10.100.1.65 255.255.255.224
 ip helper-address 10.10.100.10
!
interface GigabitEthernet0/1.30
 description VOIP
 encapsulation dot1Q 30
 ip address 10.100.1.97 255.255.255.224
 ip helper-address 10.10.100.10
!
interface GigabitEthernet0/1.40
 description GUEST
 encapsulation dot1Q 40
 ip address 10.100.1.129 255.255.255.224
 ip access-group GUEST-IN in
!
interface GigabitEthernet0/1.99
 description MGMT
 encapsulation dot1Q 99
 ip address 10.100.1.225 255.255.255.240
!
! --- WAN: primary link to the data centre ---
interface GigabitEthernet0/0
 description Primary WAN to DC-CORE1 (area 3)
 ip address 172.16.101.2 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
 service-policy output WAN-EDGE
!
! --- Backup: broadband internet plus IPsec to pfSense ---
interface GigabitEthernet0/2
 description Backup broadband internet (documentation range)
 ip address 192.0.2.2 255.255.255.252
 no ip proxy-arp
 no ip redirects
!
crypto ikev2 proposal IKEV2-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
crypto ikev2 policy IKEV2-POL
 proposal IKEV2-PROP
crypto ikev2 keyring CLINIC-KEYS
 peer PFSENSE
  address 203.0.113.1
  pre-shared-key <REDACTED>
crypto ikev2 profile IKEV2-PROFILE
 match identity remote address 203.0.113.1 255.255.255.255
 authentication remote pre-share
 authentication local pre-share
 keyring local CLINIC-KEYS
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
crypto ipsec profile VTI-PROFILE
 set transform-set TS-AES256
 set pfs group14
 set ikev2-profile IKEV2-PROFILE
!
interface Tunnel1
 description IPsec VTI to pfSense (backup path)
 ip address 172.31.1.2 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/2
 tunnel destination 203.0.113.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile VTI-PROFILE
 service-policy output WAN-EDGE
!
! --- Routing ---
router ospf 1
 router-id 1.1.1.101
 passive-interface default
 no passive-interface GigabitEthernet0/0
 area 3 stub
 area 3 authentication message-digest
 network 10.100.1.0 0.0.0.255 area 3
 network 172.16.101.0 0.0.0.3 area 3
!
! Reach the VPN peer over broadband only.
ip route 203.0.113.1 255.255.255.255 192.0.2.1 name PFSENSE-VIA-BROADBAND
! Default comes from OSPF (totally stubby area). If the primary link fails,
! this floating default (AD 250) sends everything through the tunnel.
ip route 0.0.0.0 0.0.0.0 Tunnel1 250 name VPN-BACKUP
!
end
