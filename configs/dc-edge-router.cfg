! DC-EDGE-RTR - Data centre edge router, eBGP to the provincial WAN (sanitized lab template)
! Provincial WAN is simulated: AS 65000, peering on 198.51.100.0/30 (RFC 5737).
! Secrets are replaced with <REDACTED>. Validate in your own lab before use.
hostname DC-EDGE-RTR
!
no ip domain-lookup
ip domain-name lab.example
!
username admin privilege 15 secret <REDACTED>
aaa new-model
aaa authentication login default local
ip ssh version 2
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
!
line vty 0 4
 transport input ssh
 access-class MGMT-ONLY in
!
snmp-server group MON v3 priv
snmp-server user zabbix MON v3 auth sha <REDACTED> priv aes 128 <REDACTED>
logging host 10.10.100.30
logging trap informational
service timestamps log datetime msec localtime
!
interface Loopback0
 description Management and router ID
 ip address 10.10.99.1 255.255.255.255
!
! --- Infrastructure ACL on the WAN side ---
ip access-list extended WAN-IN
 remark BGP with the provider only
 permit tcp host 198.51.100.1 host 198.51.100.2 eq bgp
 permit tcp host 198.51.100.1 eq bgp host 198.51.100.2
 remark Provincial shared services may reach the clinical application over HTTPS
 permit tcp 10.200.0.0 0.0.255.255 host 10.10.100.20 eq 443
 remark Replies to sessions started from inside
 permit tcp any 10.0.0.0 0.255.255.255 established
 permit udp any eq domain 10.0.0.0 0.255.255.255
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 deny   ip any any log
!
interface GigabitEthernet0/0
 description Provincial WAN (AS 65000)
 ip address 198.51.100.2 255.255.255.252
 ip access-group WAN-IN in
 no ip proxy-arp
 no ip redirects
 no cdp enable
!
interface GigabitEthernet0/1
 description To DC-CORE1 (area 0)
 ip address 172.16.0.2 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
interface GigabitEthernet0/2
 description To DC-CORE2 (area 0)
 ip address 172.16.0.14 255.255.255.252
 ip ospf message-digest-key 1 md5 <REDACTED>
!
! --- What we advertise and what we accept ---
ip prefix-list HEALTH-OUT seq 10 permit 10.10.0.0/16
ip prefix-list HEALTH-OUT seq 20 permit 10.20.0.0/16
ip prefix-list HEALTH-OUT seq 30 permit 10.30.0.0/16
ip prefix-list HEALTH-OUT seq 40 permit 10.100.0.0/21
!
ip prefix-list PROVINCE-IN seq 10 permit 0.0.0.0/0
ip prefix-list PROVINCE-IN seq 20 permit 10.200.0.0/16
!
! Anchor routes so the aggregates exist in the routing table for BGP to advertise.
ip route 10.10.0.0 255.255.0.0 Null0 254
ip route 10.20.0.0 255.255.0.0 Null0 254
ip route 10.30.0.0 255.255.0.0 Null0 254
ip route 10.100.0.0 255.255.248.0 Null0 254
!
router bgp 65100
 bgp router-id 1.1.1.254
 bgp log-neighbor-changes
 neighbor 198.51.100.1 remote-as 65000
 neighbor 198.51.100.1 description Provincial WAN (simulated)
 neighbor 198.51.100.1 password <REDACTED>
 !
 address-family ipv4
  network 10.10.0.0 mask 255.255.0.0
  network 10.20.0.0 mask 255.255.0.0
  network 10.30.0.0 mask 255.255.0.0
  network 10.100.0.0 mask 255.255.248.0
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 prefix-list HEALTH-OUT out
  neighbor 198.51.100.1 prefix-list PROVINCE-IN in
  neighbor 198.51.100.1 maximum-prefix 100 80
 exit-address-family
!
! --- OSPF: pass the provincial default route to the inside ---
router ospf 1
 router-id 1.1.1.254
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 area 0 authentication message-digest
 network 10.10.99.1 0.0.0.0 area 0
 network 172.16.0.0 0.0.0.3 area 0
 network 172.16.0.12 0.0.0.3 area 0
 ! Only originated while the default route from BGP is present.
 default-information originate
!
end
